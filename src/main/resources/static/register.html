<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="page.register.title">Web SSH 注册</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/login.css">
</head>

<body>
    <!-- 动态网格背景 -->
    <canvas id="gridCanvas"></canvas>

    <div class="page-language-float">
        <svg class="lang-globe-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <select id="registerLanguageSelect" aria-label="Language"></select>
    </div>

    <div class="card">
        <div class="card-glow"></div>
        <div class="logo">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="4 17 10 11 4 5"></polyline>
                    <line x1="12" y1="19" x2="20" y2="19"></line>
                </svg>
            </div>
            <h1>WebSSH</h1>
            <p class="desc" data-i18n="register.desc">创建账号 · 开启终端</p>
        </div>

        <form id="registerForm" novalidate>
            <div class="input-group">
                <div class="input-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </div>
                <input type="text" id="username" name="username" data-i18n-placeholder="register.usernamePlaceholder"
                    placeholder="用户名（3-32 位字母、数字、_.-）" autocomplete="username" required>
            </div>

            <div class="input-group">
                <div class="input-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <input type="password" id="password" name="password" data-i18n-placeholder="register.passwordPlaceholder"
                    placeholder="密码（至少 6 位）" autocomplete="new-password" required>
            </div>

            <div class="input-group">
                <div class="input-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 12l2 2 4-4"></path>
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                </div>
                <input type="password" id="confirmPassword" name="confirmPassword"
                    data-i18n-placeholder="register.confirmPasswordPlaceholder" placeholder="确认密码"
                    autocomplete="new-password" required>
            </div>

            <div class="form-message" id="formMessage" role="alert" aria-live="polite"></div>

            <button type="submit" id="submitButton">
                <span class="btn-text" data-i18n="register.submit">注册</span>
                <span class="btn-icon">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </button>
        </form>

        <div class="hint">
            <span data-i18n="register.hasAccount">已有账号？</span>
            <a class="text-link" href="/login" data-i18n="register.gotoLogin">返回登录</a>
        </div>
    </div>

    <script src="/i18n.js"></script>
    <script>
        const i18n = window.webSshI18n;
        const t = (key, params) => (i18n ? i18n.t(key, params) : key);

        if (i18n) {
            i18n.applyTranslations();
            i18n.mountLanguageSelector(document.getElementById('registerLanguageSelect'));
        }

        const form = document.getElementById('registerForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const messageBox = document.getElementById('formMessage');
        const submitButton = document.getElementById('submitButton');
        const USERNAME_PATTERN = /^[a-zA-Z0-9._-]{3,32}$/;
        let redirecting = false;

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = 'form-message visible ' + type;
        }

        function clearMessage() {
            messageBox.textContent = '';
            messageBox.className = 'form-message';
        }

        // 语言切换后重新渲染当前提示，避免残留旧语言文本
        window.addEventListener('webssh:languagechange', () => {
            if (!redirecting) {
                clearMessage();
            }
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            clearMessage();

            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmInput.value;

            if (!USERNAME_PATTERN.test(username)) {
                showMessage(t('register.error.usernameInvalid'), 'error');
                usernameInput.focus();
                return;
            }
            if (password.length < 6 || password.length > 72) {
                showMessage(t('register.error.passwordLength'), 'error');
                passwordInput.focus();
                return;
            }
            if (password !== confirmPassword) {
                showMessage(t('register.error.passwordMismatch'), 'error');
                confirmInput.focus();
                return;
            }

            submitButton.disabled = true;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, confirmPassword })
                });

                if (!response.ok) {
                    let message = '';
                    try {
                        const data = await response.json();
                        message = data && data.message ? data.message : '';
                    } catch (ignored) {
                        message = '';
                    }
                    // 后端消息为中文，交给 i18n 回译；无消息时退回通用失败文案
                    const translated = message && i18n && i18n.translateKnownMessage
                        ? i18n.translateKnownMessage(message)
                        : message;
                    showMessage(translated || t('register.error.failed'), 'error');
                    return;
                }

                redirecting = true;
                showMessage(t('register.success'), 'success');
                submitButton.disabled = true;
                setTimeout(() => { window.location.href = '/login'; }, 1200);
            } catch (error) {
                showMessage(t('register.error.network'), 'error');
            } finally {
                if (!redirecting) {
                    submitButton.disabled = false;
                }
            }
        });

        // 动态网格背景
        const canvas = document.getElementById('gridCanvas');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [], mouse = { x: -1000, y: -1000 };

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }

        function initParticles() {
            particles = [];
            const count = Math.min(Math.floor((w * h) / 18000), 80);
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: Math.random() * w,
                    y: Math.random() * h,
                    vx: (Math.random() - 0.5) * 0.3,
                    vy: (Math.random() - 0.5) * 0.3,
                    r: Math.random() * 1.5 + 0.5,
                    alpha: Math.random() * 0.5 + 0.1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);

            // 绘制连线
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 120) {
                        ctx.beginPath();
                        ctx.strokeStyle = `rgba(56, 189, 248, ${0.08 * (1 - dist / 120)})`;
                        ctx.lineWidth = 0.5;
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        ctx.stroke();
                    }
                }
            }

            // 绘制粒子
            for (const p of particles) {
                // 鼠标交互
                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                let extraAlpha = 0;
                if (dist < 200) {
                    extraAlpha = 0.3 * (1 - dist / 200);
                }

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(56, 189, 248, ${p.alpha + extraAlpha})`;
                ctx.fill();

                p.x += p.vx;
                p.y += p.vy;
                if (p.x < 0 || p.x > w) p.vx *= -1;
                if (p.y < 0 || p.y > h) p.vy *= -1;
            }

            requestAnimationFrame(draw);
        }

        resize();
        initParticles();
        draw();

        window.addEventListener('resize', () => { resize(); initParticles(); });
        document.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
        document.addEventListener('mouseleave', () => { mouse.x = -1000; mouse.y = -1000; });
    </script>
</body>

</html>
